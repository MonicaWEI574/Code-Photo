吃了。<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 长图自动化工具</title>
    <!-- 使用 Tailwind CSS 进行轻量级快速布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Ace Editor 提供代码语法高亮 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.js"></script>
    <!-- 引入 Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #e5e5e5; font-family: system-ui, -apple-system, sans-serif; }
        .toolbar { height: 50px; }
        .preview-container { width: 100vw; height: calc(100vh - 50px); overflow: hidden; position: relative; }
        iframe { border: none; width: 100%; height: 100%; display: block; }
        .code-drawer {
            position: fixed; top: 50px; left: 0; bottom: 0; width: 450px; max-width: 90vw;
            background: #fff; box-shadow: 4px 0 24px rgba(0,0,0,0.1);
            transform: translateX(0); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 40; display: flex; flex-direction: column; border-right: 1px solid #e5e7eb;
        }
        .code-drawer.collapsed { transform: translateX(-100%); }
        #code-editor { flex: 1; width: 100%; height: 100%; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3b82f6; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-left: 1px solid #ddd; border-top: 1px solid #ddd; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 6px; border: 2px solid #f1f1f1; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="text-gray-800 antialiased flex flex-col h-screen">

    <header class="toolbar bg-white border-b border-gray-200 px-4 flex items-center justify-between shrink-0 shadow-sm z-50 relative">
        <div class="flex items-center gap-4">
            <button id="btn-toggle-drawer" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded transition-colors flex items-center gap-2 text-sm font-medium border border-blue-200">
                <i data-lucide="panel-left-close" id="drawer-icon" class="w-4 h-4"></i>
                <span>代码面板</span>
            </button>
            <div class="w-px h-5 bg-gray-300 mx-1"></div>
            <span id="status-badge" class="px-2.5 py-1 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200 transition-colors whitespace-nowrap flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span> 等待输入
            </span>
            <div class="w-px h-4 bg-gray-300 mx-1 hidden sm:block"></div>
            <span class="text-xs text-gray-500 hidden sm:flex items-center gap-1.5 px-2 py-0.5 rounded bg-gray-50 border border-gray-200">
                <i data-lucide="mouse-pointer-2" class="w-3.5 h-3.5"></i> 拖拽平移 · 滚轮缩放
            </span>
        </div>

        <div class="flex items-center gap-2">
            <button id="btn-format" class="px-3 py-1.5 text-xs text-gray-600 bg-transparent rounded hover:bg-gray-100 transition-colors flex items-center gap-1">
                <i data-lucide="align-left" class="w-4 h-4"></i> <span class="hidden sm:inline">格式化</span>
            </button>
            <button id="btn-clear" class="px-3 py-1.5 text-xs text-red-600 bg-transparent rounded hover:bg-red-50 transition-colors flex items-center gap-1">
                <i data-lucide="trash-2" class="w-4 h-4"></i> <span class="hidden sm:inline">清空</span>
            </button>
            <div class="w-px h-5 bg-gray-300 mx-2"></div>
            <button id="btn-capture" class="px-5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded shadow-sm transition-all flex items-center gap-2 transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="camera" class="w-4 h-4"></i> 生成截图
            </button>
        </div>
    </header>

    <aside id="code-drawer" class="code-drawer">
        <div class="bg-gray-50 px-3 py-2 text-xs font-semibold text-gray-500 border-b flex justify-between items-center">
            <span>HTML / CSS / JS 输入区 (自动识别)</span>
            <button id="btn-close-drawer-inner" class="text-gray-400 hover:text-gray-700 p-1 rounded-sm hover:bg-gray-200 transition">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
        </div>
        <div id="code-editor"></div>
    </aside>

    <main class="preview-container" id="preview-scroll-area">
        <iframe id="render-frame" sandbox="allow-scripts allow-same-origin"></iframe>
        
        <div id="capture-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col justify-center items-center z-50 hidden transition-opacity" style="position: fixed;">
            <div class="loader mb-4"></div>
            <p class="text-gray-800 font-bold text-lg tracking-wide">正在快照全景长图，请勿刷新...</p>
            <p class="text-sm text-gray-600 mt-2 bg-white px-4 py-2 rounded-full shadow-sm border">这可能需要几秒钟时间</p>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const editorDiv = document.getElementById('code-editor');
        const renderFrame = document.getElementById('render-frame');
        const statusBadge = document.getElementById('status-badge');
        const btnCapture = document.getElementById('btn-capture');
        const captureOverlay = document.getElementById('capture-overlay');
        const codeDrawer = document.getElementById('code-drawer');
        const btnToggleDrawer = document.getElementById('btn-toggle-drawer');
        const btnCloseDrawerInner = document.getElementById('btn-close-drawer-inner');
        const drawerIcon = document.getElementById('drawer-icon');

        let isDrawerOpen = true;
        function toggleDrawer() {
            isDrawerOpen = !isDrawerOpen;
            if (isDrawerOpen) {
                codeDrawer.classList.remove('collapsed');
                drawerIcon.setAttribute('data-lucide', 'panel-left-close');
                btnToggleDrawer.classList.replace('bg-transparent', 'bg-blue-50');
            } else {
                codeDrawer.classList.add('collapsed');
                drawerIcon.setAttribute('data-lucide', 'panel-left-open');
                btnToggleDrawer.classList.replace('bg-blue-50', 'bg-transparent');
            }
            lucide.createIcons();
        }
        btnToggleDrawer.addEventListener('click', toggleDrawer);
        btnCloseDrawerInner.addEventListener('click', toggleDrawer);

        const editor = ace.edit(editorDiv);
        editor.setTheme("ace/theme/chrome");
        editor.session.setMode("ace/mode/html"); 
        editor.setOptions({ fontSize: "14px", showPrintMargin: false, wrap: true, useWorker: false });

        editor.setValue(`<!-- 
🌟 工具已升级：后台“隐形修复引擎”上线！

您现在可以直接将原版包含动画、滤镜、渐变的 HTML 代码贴入下方。
工具的预览区将 100% 保持您代码原本的模样。

只有在您点击「生成截图」的瞬间，工具才会在隐藏的后台，
将 html2canvas 无法解析的错误特效自动替换为安全样式并截取，
保证截图排版绝不错位，毫无乱码！
-->`, -1);

        let renderTimeout;

        function setStatus(status) {
            statusBadge.className = 'px-2.5 py-1 rounded text-xs font-medium transition-colors whitespace-nowrap flex items-center gap-1';
            statusBadge.title = '';
            if (status === 'rendering') {
                statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span> 代码渲染中';
                statusBadge.classList.add('bg-yellow-50', 'text-yellow-700', 'border', 'border-yellow-200');
                btnCapture.disabled = true;
            } else if (status === 'ready') {
                statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span> 渲染就绪';
                statusBadge.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
                btnCapture.disabled = false;
            } else if (status === 'waiting') {
                statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-blue-500"></span> 等待输入';
                statusBadge.classList.add('bg-blue-50', 'text-blue-700', 'border', 'border-blue-200');
                btnCapture.disabled = false;
            } else if (status === 'error') {
                statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> 渲染错误';
                statusBadge.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
                btnCapture.disabled = false;
            }
        }

        const controlScripts = `
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"><\/script>
        <script>
            window.addEventListener('error', function(e) { if(e.message === 'Script error.') return; window.parent.postMessage({ type: 'code-error', error: e.message }, '*'); });

            setTimeout(() => {
                const isReactMode = !!document.getElementById('tool-canvas-stage');
                const viewport = isReactMode ? document.getElementById('viewport') : document.documentElement;
                const stage = isReactMode ? document.getElementById('tool-canvas-stage') : document.body;
                const rootElement = isReactMode ? document.getElementById('capture-root') : document.body;

                if (!isReactMode) {
                    document.documentElement.style.overflow = 'hidden';
                    document.documentElement.style.backgroundColor = '#e5e5e5';
                    document.body.style.transformOrigin = '0 0';
                    document.body.style.margin = '40px auto';
                    document.body.style.minWidth = 'calc(100vw - 80px)';
                    document.body.style.width = 'max-content';
                    document.body.style.boxShadow = '0 20px 60px -15px rgba(0,0,0,0.1)';
                    document.body.style.backgroundColor = '#fff';
                    document.body.style.position = 'absolute';
                }

                let scale = 1, translateX = 0, translateY = 0, isDragging = false, startX, startY;

                function updateTransform() {
                    stage.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')';
                }

                window.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? 0.97 : 1.03; 
                    const mouseX = e.clientX; const mouseY = e.clientY;
                    const prevScale = scale;
                    scale *= delta; scale = Math.min(Math.max(0.05, scale), 5);
                    translateX = mouseX - (mouseX - translateX) * (scale / prevScale);
                    translateY = mouseY - (mouseY - translateY) * (scale / prevScale);
                    updateTransform();
                }, { passive: false });

                window.addEventListener('mousedown', (e) => { if (e.button !== 0) return; isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; });
                window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform(); });
                window.addEventListener('mouseup', () => isDragging = false);
                window.addEventListener('mouseleave', () => isDragging = false);

                window.addEventListener('message', async function(event) {
                    if (event.data === 'take-screenshot') {
                        var oldTransform = stage.style.transform;
                        try {
                            await new Promise(resolve => setTimeout(resolve, 500)); 
                            stage.style.transform = 'none';
                            stage.getBoundingClientRect();
                            await new Promise(r => requestAnimationFrame(r)); await new Promise(r => requestAnimationFrame(r)); 

                            const captureWidth = rootElement.scrollWidth;
                            const captureHeight = Math.max(rootElement.scrollHeight, rootElement.offsetHeight);

                            html2canvas(rootElement, {
                                scrollY: -window.scrollY, scrollX: -window.scrollX,
                                windowWidth: captureWidth, windowHeight: captureHeight,
                                width: captureWidth, height: captureHeight,
                                useCORS: true, allowTaint: true, backgroundColor: '#ffffff', scale: window.devicePixelRatio || 2, logging: false,
                                
                                // 🌟 魔法核心：在截图创建的隐形克隆体上，暴力修复所有兼容Bug，绝不触碰用户的原生 DOM！
                                onclone: function(clonedDoc) {
                                    const fixStyle = clonedDoc.createElement('style');
                                    fixStyle.innerHTML = \`
                                        /* 1. 解决动画截半空：强制结束所有浮动动画 */
                                        *, *::before, *::after {
                                            animation: none !important;
                                            transition: none !important;
                                            opacity: 1 !important;
                                            transform: none !important;
                                        }
                                        /* 2. 解决渐变文本实心红块 Bug：退化为纯色文本 */
                                        .text-gradient {
                                            background: none !important;
                                            -webkit-text-fill-color: initial !important;
                                            color: #E60012 !important; 
                                        }
                                        /* 3. 解决 blur 变黑圈 Bug：替换为兼容极好的安全径向渐变 */
                                        .bg-circle {
                                            filter: none !important;
                                            background-color: transparent !important;
                                            background-image: radial-gradient(circle, rgba(230,0,18,0.15) 0%, rgba(230,0,18,0) 70%) !important;
                                        }
                                        /* 4. 强制闭合 SVG 动画圆环：写死进度使其渲染 */
                                        .circle { stroke-dasharray: 92, 100 !important; }
                                        /* 5. 防排版错乱与截断：释放高度，让吸顶归位 */
                                        .min-h-[85vh], .h-screen, .min-h-screen { min-height: 100% !important; height: auto !important; max-height: none !important; }
                                        .sticky, .fixed { position: relative !important; top: auto !important; z-index: auto !important; }
                                    \`;
                                    clonedDoc.head.appendChild(fixStyle);
                                }
                            }).then(canvas => {
                                stage.style.transform = oldTransform; 
                                window.parent.postMessage({ type: 'capture-success', data: canvas.toDataURL('image/png', 1.0) }, '*');
                            }).catch(err => {
                                stage.style.transform = oldTransform; window.parent.postMessage({ type: 'capture-error', error: err.message }, '*');
                            });
                        } catch (e) {
                             stage.style.transform = oldTransform; window.parent.postMessage({ type: 'capture-error', error: e.message }, '*');
                        }
                    }
                });

                // Auto-center
                const stageRect = stage.getBoundingClientRect(); 
                const vpWidth = window.innerWidth; const vpHeight = window.innerHeight;
                if (stageRect.width > vpWidth - 60) scale = (vpWidth - 60) / stageRect.width;
                translateX = (vpWidth - stageRect.width * scale) / 2;
                translateY = Math.max((vpHeight - stageRect.height * scale) / 2, 20); 
                updateTransform();
                
                window.parent.postMessage({ type: 'render-ready' }, '*');
            }, 600);
        <\/script>`;

        function updatePreview() {
            setStatus('rendering');
            const rawCode = editor.getValue();
            
            if (!rawCode.trim()) {
                setStatus('waiting');
                renderFrame.srcdoc = `<body><h2 style="font-family:sans-serif;color:#64748b;text-align:center;margin-top:20vh;">👉 请在左侧粘贴代码</h2></body>`;
                return;
            }

            const isFullHTML = /<!DOCTYPE\s+html>/i.test(rawCode) || /<html/i.test(rawCode);
            let injectedHTML = '';

            if (isFullHTML) {
                // 完全不污染用户的 head，仅在 body 后方植入我们的截图画板脚本
                let html = rawCode;
                if (html.includes('</body>')) {
                    html = html.replace('</body>', controlScripts + '</body>');
                } else {
                    html += controlScripts;
                }
                injectedHTML = html;
            } 
            else {
                // 原版纯 React 解析
                let safeCode = rawCode.replace(/(?:import|from)\s+['"]([^'.\/][^'"]*)['"]/g, (match, pkg) => {
                    if (pkg === 'react') return match.replace(pkg, 'https://esm.sh/react@18.3.1');
                    if (pkg === 'react-dom/client') return match.replace(pkg, 'https://esm.sh/react-dom@18.3.1/client');
                    if (pkg === 'react-dom') return match.replace(pkg, 'https://esm.sh/react-dom@18.3.1');
                    if (pkg === 'lucide-react') return match.replace(pkg, 'https://esm.sh/lucide-react@0.378.0?deps=react@18.3.1,react-dom@18.3.1');
                    return match.replace(pkg, `https://esm.sh/${pkg}?deps=react@18.3.1,react-dom@18.3.1`);
                });

                injectedHTML = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body { margin: 0 !important; padding: 0 !important; width: 100vw !important; height: 100vh !important; overflow: hidden !important; background-color: #e5e5e5; user-select: none; -webkit-user-select: none; }
        #viewport { width: 100vw; height: 100vh; position: relative; cursor: grab; }
        #viewport:active { cursor: grabbing; }
        #tool-canvas-stage { position: absolute; transform-origin: 0 0; will-change: transform; padding: 40px; box-sizing: border-box; display: inline-block; }
        #capture-root { width: max-content; max-width: none; box-shadow: 0 20px 60px -15px rgba(0,0,0,0.1); background: #fff; user-select: auto; -webkit-user-select: auto; cursor: auto; }
    </style>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
        "lucide-react": "https://esm.sh/lucide-react@0.378.0?external=react,react-dom"
      }
    }
    <\/script>
</head>
<body>
    <div id="viewport">
        <div id="tool-canvas-stage">
            <div id="capture-root">
                <div id="react-app-root"></div>
            </div>
        </div>
    </div>
    
    ${controlScripts}

    <script type="text/babel" data-presets="react" data-type="module">
        import { createRoot } from 'react-dom/client';
        ${safeCode}
        try {
            const container = document.getElementById('react-app-root');
            const root = createRoot(container);
            root.render(<App />);
        } catch(e) {
            window.parent.postMessage({ type: 'code-error', error: e.message }, '*');
        }
    <\/script>
</body>
</html>`;
            }

            renderFrame.srcdoc = injectedHTML;
        }

        editor.session.on('change', function() {
            clearTimeout(renderTimeout);
            renderTimeout = setTimeout(updatePreview, 1000);
        });

        updatePreview();

        document.getElementById('btn-clear').addEventListener('click', () => {
            if(confirm('确定要清空所有代码吗？')) {
                editor.setValue('', -1);
                if(codeDrawer.classList.contains('collapsed')) toggleDrawer(); 
                editor.focus();
            }
        });

        document.getElementById('btn-format').addEventListener('click', () => {
            const val = editor.session.getValue();
            const formatted = val.replace(/></g, '>\n<'); 
            editor.session.setValue(formatted);
        });

        function getFilename() {
            const date = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            return `canvas-long-${date.getFullYear()}${pad(date.getMonth()+1)}${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}.png`;
        }

        btnCapture.addEventListener('click', () => {
            captureOverlay.classList.remove('hidden');
            if(!codeDrawer.classList.contains('collapsed')) toggleDrawer();
            renderFrame.contentWindow.postMessage('take-screenshot', '*');
        });

        window.addEventListener('message', function(event) {
            const msg = event.data;
            if (!msg || typeof msg !== 'object') return;

            if (msg.type === 'render-ready') {
                setStatus('ready');
            } 
            else if (msg.type === 'code-error') {
                setStatus('error');
                statusBadge.title = '错误详情（调试用）: ' + (msg.error || '未知错误');
            }
            else if (msg.type === 'capture-success') {
                captureOverlay.classList.add('hidden');
                
                const link = document.createElement('a');
                link.download = getFilename();
                link.href = msg.data;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                const originalHtml = btnCapture.innerHTML;
                btnCapture.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i> 保存成功';
                btnCapture.classList.replace('bg-blue-600', 'bg-green-600');
                btnCapture.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
                lucide.createIcons();

                setTimeout(() => {
                    btnCapture.innerHTML = originalHtml;
                    btnCapture.classList.replace('bg-green-600', 'bg-blue-600');
                    btnCapture.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
                    lucide.createIcons();
                }, 2500);
            } 
            else if (msg.type === 'capture-error') {
                captureOverlay.classList.add('hidden');
                setStatus('error');
                alert('截图生成失败：' + (msg.error || '未知错误，请检查代码'));
            }
        });
    </script>
</body>
</html>
